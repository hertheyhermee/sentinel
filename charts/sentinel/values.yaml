namespace: sentinel
appName: sentinel

images:
  api: ghcr.io/hertheyhermee/sentinel-api:latest
  scheduler: ghcr.io/hertheyhermee/sentinel-scheduler:latest
  worker: ghcr.io/hertheyhermee/sentinel-worker:latest
  postgres: postgres:16-alpine
  redis: redis:7-alpine

replicaCounts:
  api: 1
  scheduler: 1
  worker: 2

config:
  probeTimeoutSeconds: "10"
  schedulerIntervalSeconds: "5"
  workerBlockTimeoutSeconds: "5"
  logLevel: INFO

secrets:
  postgresUser: sentinel
  postgresPassword: sentinel
  postgresDb: sentinel
  databaseUrl: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
  redisUrl: redis://redis:6379/0
  queueKey: sentinel:checks

resources:
  api:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  scheduler:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  worker:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  pvcSize: 1Gi
  storageClassName: standard

redis:
  pvcSize: 1Gi
  storageClassName: standard
