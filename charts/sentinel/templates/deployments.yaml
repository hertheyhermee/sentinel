{{- $images := .Values.images -}}
{{- $config := .Values.config -}}
{{- $resources := .Values.resources -}}
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
    component: api
spec:
  selector:
    app: {{ .Values.appName }}
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
    component: api
spec:
  replicas: {{ .Values.replicaCounts.api }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
      component: api
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
        component: api
    spec:
      containers:
        - name: sentinel-api
          image: {{ $images.api }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: REDIS_URL
            - name: QUEUE_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: QUEUE_KEY
            - name: PROBE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: PROBE_TIMEOUT_SECONDS
            - name: SCHEDULER_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: SCHEDULER_INTERVAL_SECONDS
            - name: WORKER_BLOCK_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: WORKER_BLOCK_TIMEOUT_SECONDS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: LOG_LEVEL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ $resources.api.requests.cpu }}
              memory: {{ $resources.api.requests.memory }}
            limits:
              cpu: {{ $resources.api.limits.cpu }}
              memory: {{ $resources.api.limits.memory }}
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
---
