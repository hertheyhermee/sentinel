apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: {{ .Values.namespace }}
data:
  PROBE_TIMEOUT_SECONDS: {{ .Values.config.probeTimeoutSeconds | quote }}
  SCHEDULER_INTERVAL_SECONDS: {{ .Values.config.schedulerIntervalSeconds | quote }}
  WORKER_BLOCK_TIMEOUT_SECONDS: {{ .Values.config.workerBlockTimeoutSeconds | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  QUEUE_KEY: {{ .Values.secrets.queueKey | quote }}
