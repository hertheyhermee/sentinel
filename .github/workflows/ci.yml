name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch/PR cancels the previous run instead of both
# running to completion, since only the latest commit's result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - run: pip install -r requirements/dev.txt

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy libs services

      - name: Hadolint - api
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: services/api/Dockerfile
          config: .hadolint.yaml

      - name: Hadolint - worker
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: services/worker/Dockerfile
          config: .hadolint.yaml

      - name: Hadolint - scheduler
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: services/scheduler/Dockerfile
          config: .hadolint.yaml

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - run: pip install -r requirements/dev.txt
      - run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # Builds each service image, scans it with Trivy, and only on a push to
  # main pushes, signs and SBOMs it. Matrixed rather than duplicated three
  # times; the actual sequence lives in the composite action.
  build:
    name: Build and scan (${{ matrix.service }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, scheduler]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-scan-publish
        with:
          service: ${{ matrix.service }}
          image-name: ghcr.io/${{ github.repository_owner }}/sentinel-${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

  # Independent of the build job on purpose: it builds its own local images
  # via docker compose rather than pulling from GHCR, so it exercises exactly
  # what a contributor runs locally and does not wait on the publish job.
  integration-test:
    name: Integration test (docker compose)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cp .env.example .env

      - run: docker compose up -d --build

      - run: ./scripts/smoke.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
