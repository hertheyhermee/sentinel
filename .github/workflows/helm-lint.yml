name: helm-lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint ./charts/sentinel

      - name: Render chart
        run: helm template sentinel ./charts/sentinel >/tmp/sentinel-rendered.yaml
