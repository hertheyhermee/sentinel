version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/services/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/worker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/scheduler"
    schedule:
      interval: "weekly"

  # Pins like actions/checkout@v4 still resolve to a moving tag; Dependabot
  # bumping this file is what actually catches upstream action changes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
