apiVersion: v1
kind: Service
metadata:
  name: sentinel-worker
  namespace: sentinel
  labels:
    app: sentinel
    component: worker
spec:
  ports:
    - port: 9101
      targetPort: 9101
      protocol: TCP
      name: metrics
  selector:
    app: sentinel
    component: worker
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
  namespace: sentinel
  labels:
    app: sentinel
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel
      component: worker
  template:
    metadata:
      labels:
        app: sentinel
        component: worker
    spec:
      containers:
        - name: sentinel-worker
          image: ghcr.io/hertheyhermee/sentinel-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9101
              name: metrics
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: REDIS_URL
            - name: QUEUE_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: QUEUE_KEY
            - name: PROBE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: PROBE_TIMEOUT_SECONDS
            - name: SCHEDULER_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: SCHEDULER_INTERVAL_SECONDS
            - name: WORKER_BLOCK_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: WORKER_BLOCK_TIMEOUT_SECONDS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sentinel-config
                  key: LOG_LEVEL
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9101
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9101
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
