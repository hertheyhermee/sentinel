apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-api-pdb
  namespace: sentinel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sentinel
      component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-scheduler-pdb
  namespace: sentinel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sentinel
      component: scheduler
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-worker-pdb
  namespace: sentinel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sentinel
      component: worker
