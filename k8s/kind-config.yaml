kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 8000
        hostPort: 8000
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 9100
        hostPort: 9100
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 9101
        hostPort: 9101
        listenAddress: "127.0.0.1"
        protocol: TCP
