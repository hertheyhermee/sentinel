name: sentinel

# Build context is the repository root for every service so that libs/ can be
# copied into each image. The Dockerfile path is what differs.

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QUEUE_KEY: ${QUEUE_KEY:-sentinel:checks}
  PROBE_TIMEOUT_SECONDS: ${PROBE_TIMEOUT_SECONDS:-10}
  SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-5}
  WORKER_BLOCK_TIMEOUT_SECONDS: ${WORKER_BLOCK_TIMEOUT_SECONDS:-5}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # appendonly keeps the queue across restarts so a compose restart does not
    # silently drop pending probe jobs.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    environment: *app-env
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The scheduler must not start before the schema exists.
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    # Scale horizontally with:  docker compose up -d --scale worker=3
    # No host port mapping, so replicas do not collide on ports.

volumes:
  postgres-data:
  redis-data:
